name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install tools
        run: |
          go install github.com/google/wire/cmd/wire@latest
          go install github.com/vektra/mockery/v3@latest

      - name: Regenerate wire + mocks (drift check)
        run: |
          make wire
          make mocks
          if ! git diff --exit-code; then
            echo "::error::wire/mocks drift detected — run 'make wire mocks' locally" >&2
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Unit tests + race detector
        run: |
          make test
          make test-race

      - name: govulncheck
        run: make vuln
