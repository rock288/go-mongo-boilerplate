name: Feature request
description: Propose a new capability or enhancement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or missing capability motivates this?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What you'd like to see. Be specific about the API/UX if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you rejected them.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, screenshots, related issues.
