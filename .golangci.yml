version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - ineffassign
    - unused
    - misspell

  settings:
    revive:
      rules:
        # Godoc-comment enforcement disabled for the boilerplate — re-enable
        # in your downstream repo if you want full doc coverage.
        - name: exported
          disabled: true
        - name: var-naming
          disabled: false

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: wire_gen\.go
        linters: [unused, errcheck]
      - path: mocks/
        linters: [unused, revive]
      # cmd/init is a developer CLI: it intentionally reads user-supplied paths
      # and shells out to wire/mockery/go — gosec's tainted-input rules apply
      # to long-running services, not one-shot tools that self-destruct.
      - path: cmd/init/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
