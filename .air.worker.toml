# air hot-reload config for cmd/worker. Run via `make dev-worker`.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  bin = "./tmp/worker"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["bin", "tmp", "cmd/init", "migrations", "docs", "plans"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  delay = 1000

[misc]
  clean_on_exit = true
